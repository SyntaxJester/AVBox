<style>
/* ============ tokens：暗色 + 绯红识别色 ============ */
:root{
  --text:#F2ECEE;
  --muted:#9A9098;
  --panel:rgba(24,16,20,0.60);
  --panel-2:rgba(30,20,26,0.82);
  --panel-strong:rgba(18,12,16,0.92);
  --line:rgba(255,255,255,0.10);
  --solid:#140D12;
  --solid-2:#1E141A;
  --solid-3:#2A1B24;
  --rose:#F4285E;        /* 主强调：绯红 */
  --rose-2:#FF5C86;      /* 亮玫红 */
  --gold:#E7B44C;        /* 时长/角标 */
  --ok:#37D0A0;
  --radius:14px;
  --safe-top:0px; --safe-bottom:0px; --safe-left:0px; --safe-right:0px;
}
:root{
  --safe-top:var(--fm-safe-top,0px);
  --safe-bottom:var(--fm-safe-bottom,0px);
  --safe-left:var(--fm-safe-left,0px);
  --safe-right:var(--fm-safe-right,0px);
}
@supports (top: max(0px, 1px)){
  :root{
    --safe-top:max(var(--fm-safe-top,0px), env(safe-area-inset-top,0px));
    --safe-bottom:max(var(--fm-safe-bottom,0px), env(safe-area-inset-bottom,0px));
    --safe-left:max(var(--fm-safe-left,0px), env(safe-area-inset-left,0px));
    --safe-right:max(var(--fm-safe-right,0px), env(safe-area-inset-right,0px));
  }
}

*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
html,body{
  margin:0; padding:0; height:100%;
  background:transparent;            /* App 壁纸透出 */
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
html:not(.fm-native) body{ background:#0B0810; }  /* 浏览器预览兜底底色 */
body{
  min-height:100vh; min-height:var(--fm-web-height,100vh);
  overflow-x:hidden; position:relative;
}
/* 压暗层：垫在内容底、壁纸之上，绯红夜色，可读性回来 */
body::before{
  content:''; position:fixed; top:0;left:0;right:0;bottom:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(85% 55% at 84% -6%, rgba(244,40,94,0.26), transparent 60%),
    radial-gradient(80% 50% at 10% 4%,  rgba(120,40,90,0.22), transparent 58%),
    radial-gradient(90% 60% at 6% 106%, rgba(244,40,94,0.16), transparent 60%),
    linear-gradient(165deg,#1a0e16 0%,#150b12 40%,#100a10 72%,#0b0710 100%);
}
body::after{
  content:''; position:fixed; top:-20%;left:-20%;right:-20%;bottom:-20%; z-index:-1; pointer-events:none;
  background:
    radial-gradient(42% 22% at 28% 26%, rgba(244,40,94,0.12), transparent 70%),
    radial-gradient(46% 24% at 72% 68%, rgba(255,92,134,0.10), transparent 70%);
  filter:blur(30px); opacity:.85;
  animation:drift 30s ease-in-out infinite alternate;
}
@keyframes drift{ 0%{transform:translate(0,0);} 50%{transform:translate(3%,-2%) scale(1.06);} 100%{transform:translate(-3%,2%) scale(1.03);} }
@media (prefers-reduced-motion: reduce){ body::after{ animation:none; } }

img{ border:0; display:block; }
button,input{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; }
a{ color:inherit; text-decoration:none; }

/* ============ 顶栏 ============ */
.top{
  position:sticky; top:0; z-index:40;
  padding:8px 12px; padding-top:calc(var(--safe-top) + 6px);
  padding-left:calc(var(--safe-left) + 12px); padding-right:calc(var(--safe-right) + 12px);
  background:rgba(16,10,14,0.78);
  border-bottom:1px solid rgba(244,40,94,0.16);
}
@supports (backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px)){
  .top{ -webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3); background:rgba(16,10,14,0.55); }
}
.top-row{ position:relative; white-space:nowrap; margin-bottom:8px; }
.brand{ display:inline-block; vertical-align:middle; line-height:40px; }
.brand .mark{ display:inline-block; vertical-align:middle; color:var(--rose); line-height:0; transition:color .25s ease, filter .25s ease;
  filter:drop-shadow(0 0 3px currentColor); }
.brand .mark.bad{ color:#7C7078; }
.brand .word{
  display:inline-block; vertical-align:middle; margin-left:9px;
  font-size:20px; font-weight:800; letter-spacing:.05em;
  color:#FCE7EE;
  text-shadow:0 0 10px rgba(255,92,134,0.45), 0 0 2px rgba(255,92,134,0.65);
}
@media (prefers-reduced-motion: reduce){ .brand .mark{ transition:none; } }
.brand:focus .word{ color:#fff; text-shadow:0 0 12px rgba(244,40,94,0.75); }
.brand:focus .mark{ color:#fff; }
.gear{
  position:absolute; right:0; top:2px;
  display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; color:var(--rose); line-height:0;
  filter:drop-shadow(0 0 3px currentColor);
  transition:transform .3s ease, color .25s ease, filter .25s ease;
}
.gear:active{ transform:rotate(20deg) scale(0.9); }
.gear:focus{ color:var(--rose-2); filter:drop-shadow(0 0 6px currentColor); }

.search{ display:block; width:100%; position:relative; }
.search input{
  width:100%; height:40px; line-height:40px; padding:0 40px 0 14px;
  border-radius:999px; border:1.5px solid transparent; outline:none; font-size:15px;
  background-image:
    linear-gradient(var(--panel-2),var(--panel-2)),
    linear-gradient(120deg,var(--rose),var(--rose-2) 50%,var(--gold) 100%);
  background-origin:border-box; background-clip:padding-box,border-box;
  box-shadow:0 2px 12px rgba(244,40,94,0.14);
}
.search input::placeholder{ color:rgba(154,144,152,0.85); }
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{ -webkit-appearance:none; appearance:none; display:none; }
.search input:focus{ box-shadow:0 0 0 3px rgba(244,40,94,0.22); }
.search .go{
  position:absolute; right:4px; top:3px; width:34px; height:34px;
  display:inline-flex; align-items:center; justify-content:center; color:var(--muted); line-height:0;
}
.search .go:focus{ color:var(--rose-2); }

/* 搜索联想 */
.sug{
  position:absolute; top:46px; left:0; right:0; z-index:80; display:none;
  border-radius:12px; overflow:hidden;
  background:var(--panel-strong); border:1px solid var(--line);
  box-shadow:0 16px 40px rgba(10,4,8,0.5);
}
@supports (backdrop-filter: blur(2px)){ .sug{ -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); } }
.sug.open{ display:block; }
.sug-row{ position:relative; border-bottom:1px solid rgba(255,255,255,0.05); }
.sug-row:last-child{ border-bottom:0; }
.sug-hit{ display:block; width:100%; padding:12px 42px 12px 14px; text-align:left; font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sug-row.on .sug-hit, .sug-hit:focus{ background:rgba(244,40,94,0.16); color:#fff; }
.sug .k{ color:var(--muted); margin-right:10px; }
.sug-del{ position:absolute; right:4px; top:4px; width:36px; height:36px; color:var(--muted); font-size:17px; line-height:36px; text-align:center; }
.sug-del:focus{ color:var(--rose-2); }
body.searching .wrap, body.searching .tabs{ opacity:.4; }
.wrap,.tabs{ transition:opacity .2s ease; }
@media (prefers-reduced-motion: reduce){ body.searching .wrap, body.searching .tabs, .wrap, .tabs{ transition:none; } }

/* ============ tabs ============ */
.tabs{
  position:sticky; top:0; z-index:30;
  display:block; white-space:nowrap; overflow-x:auto; overflow-y:hidden;
  padding:8px 12px; padding-left:calc(var(--safe-left) + 12px); padding-right:calc(var(--safe-right) + 12px);
  -webkit-overflow-scrolling:touch;
  background:rgba(14,9,13,0.55);
}
@supports (backdrop-filter: blur(2px)){ .tabs{ -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); } }
.tabs::-webkit-scrollbar{ display:none; }
.tabs.off{ display:none; }
.tab{
  display:inline-block; vertical-align:middle; margin-right:8px;
  padding:7px 14px; border-radius:999px; font-size:14px; color:var(--muted);
  background:var(--panel); border:1px solid var(--line); white-space:nowrap;
  transition:color .2s ease, background .2s ease;
}
.tab.on{ color:#fff; background:linear-gradient(120deg,rgba(244,40,94,0.9),rgba(255,92,134,0.9)); border-color:transparent; }
.tab:focus{ color:#fff; border-color:var(--rose-2); }

/* 二级页标题栏（女优/标签列表） */
.subbar{ display:none; position:sticky; top:0; z-index:30; align-items:center;
  padding:8px 12px; padding-left:calc(var(--safe-left) + 12px); padding-right:calc(var(--safe-right) + 12px);
  background:rgba(14,9,13,0.6); border-bottom:1px solid var(--line); }
@supports (backdrop-filter: blur(2px)){ .subbar{ -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); } }
.subbar.on{ display:flex; }
.subbar .bk{ width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; color:var(--text); line-height:0; margin-right:6px; border-radius:10px; }
.subbar .bk:focus{ color:var(--rose-2); background:rgba(255,255,255,0.06); }
.subbar .st{ font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ============ 列表 grid ============ */
.wrap{ padding:12px; padding-left:calc(var(--safe-left) + 12px); padding-right:calc(var(--safe-right) + 12px);
  padding-bottom:calc(var(--safe-bottom) + 24px); }
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.no-grid .grid{ display:block; }
.no-grid .card{ display:inline-block; width:48%; vertical-align:top; margin:1%; }
@media (min-width:560px){ .grid{ grid-template-columns:repeat(3,1fr); } }
@media (min-width:820px){ .grid{ grid-template-columns:repeat(4,1fr); } }
@media (min-width:1200px){ .grid{ grid-template-columns:repeat(5,1fr); } }
.fm-tv .grid{ grid-template-columns:repeat(4,1fr); gap:16px; }
.no-layout-gap .grid{ gap:0; }
.no-layout-gap .card{ margin:0 12px 12px 0; }

.card{ position:relative; }
.card-inner{
  border-radius:var(--radius); overflow:hidden;
  background:var(--panel); border:1px solid var(--line);
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.card:focus, .card:focus-within{ outline:none; }
.card:focus .card-inner, .card .card-inner.focus{
  border-color:var(--rose-2);
  box-shadow:0 0 0 2px rgba(244,40,94,0.55), 0 10px 26px rgba(10,4,8,0.5);
  transform:translateY(-2px);
}
.thumb{ position:relative; width:100%; aspect-ratio:16 / 9; background:#1a1017; overflow:hidden; }
.no-aspect-ratio .thumb{ height:0; padding-top:56.25%; }
.thumb img{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .3s ease; }
.thumb img.in{ opacity:1; }
.dur{ position:absolute; right:6px; bottom:6px; z-index:2;
  padding:1px 6px; border-radius:6px; font-size:11px; font-weight:700; color:#fff;
  background:rgba(8,4,8,0.78); }
.ribbon{ position:absolute; left:0; top:0; z-index:2; padding:2px 8px; font-size:11px; font-weight:700;
  color:#fff; background:linear-gradient(120deg,var(--rose),var(--rose-2)); border-bottom-right-radius:8px; }
.meta{ padding:8px 9px 10px; }
.tt{ font-size:13px; line-height:1.35; color:var(--text);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.7em; }
.sub{ margin-top:5px; font-size:11px; color:var(--muted); display:flex; align-items:center; }
.no-layout-gap .sub{ display:block; }
.sub .who{ color:var(--rose-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%; }
.sub .hit{ margin-left:auto; }
.no-layout-gap .sub .hit{ margin-left:8px; }

/* 骨架 */
.grid.skel .card-inner{ border-color:transparent; }
.sk .thumb{ background:linear-gradient(100deg,#1c121a 30%,#26161f 50%,#1c121a 70%); background-size:200% 100%; animation:shine 1.2s linear infinite; }
.sk .bar{ height:11px; border-radius:6px; margin:9px; background:#22141c; }
.sk .bar.short{ width:50%; }
@keyframes shine{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
@media (prefers-reduced-motion: reduce){ .sk .thumb{ animation:none; } }

/* 状态 / 更多 */
.state{ text-align:center; color:var(--muted); padding:26px 16px; font-size:14px; }
.state.act{ display:inline-block; margin:14px auto; padding:9px 22px; border-radius:999px;
  background:var(--panel-2); border:1px solid var(--line); color:var(--text); }
.state.act:focus{ border-color:var(--rose-2); color:#fff; }
.more-wrap{ text-align:center; }
.empty{ padding:44px 20px; text-align:center; color:var(--muted); }
.empty .big{ font-size:34px; margin-bottom:8px; }
.empty .ttl{ color:var(--text); font-size:15px; font-weight:700; margin-bottom:4px; }
.diag-box{ margin:12px auto 0; max-width:520px; text-align:left; font-size:11px; line-height:1.7;
  color:var(--muted); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; word-break:break-all; }

/* ============ 详情浮层 ============ */
.sheet{
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:90;
  display:none; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--panel-strong);
}
@supports (backdrop-filter: blur(2px)){ .sheet{ -webkit-backdrop-filter:blur(22px) saturate(1.2); backdrop-filter:blur(22px) saturate(1.2); } }
.sheet.on{ display:block; }
body.detail-active .app{ visibility:hidden; pointer-events:none; }
/* 头栏浮在海报上：透明 + 顶部渐隐，只留返回键 */
.sheet-hd{ position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:center;
  padding:10px 12px; padding-top:calc(var(--safe-top) + 8px);
  padding-left:calc(var(--safe-left) + 10px); padding-right:calc(var(--safe-right) + 10px);
  background:none; pointer-events:none; }
.sheet-hd .bk{ width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; color:#fff; line-height:0;
  border-radius:999px; background:rgba(10,5,8,0.42); pointer-events:auto; }
@supports (backdrop-filter: blur(2px)){ .sheet-hd .bk{ -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); } }
.sheet-hd .bk:focus{ background:rgba(244,40,94,0.9); color:#fff; }
.sheet-hd .tt{ display:none; }   /* 沉浸式：头栏不再显示重复标题，大标题在海报下方 */

.detail-body{ padding:0 0 calc(var(--safe-bottom) + 28px); }
.detail-inner{ padding:0 14px;
  padding-left:calc(var(--safe-left) + 14px); padding-right:calc(var(--safe-right) + 14px);
  margin-top:-52px; position:relative; z-index:2; }   /* 标题上移，压在海报渐隐处 */

/* 沉浸式大海报：全宽铺满、顶到状态栏后面；16:9 完整显示封面不裁切 */
.hero{ position:relative; width:100%; aspect-ratio:16 / 9; background:#160d13; overflow:hidden; }
.no-aspect-ratio .hero{ height:0; padding-top:56.25%; }
.hero img{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
/* 顶部压暗，保证状态栏图标 + 返回键在亮海报上也看得清 */
.hero-topscrim{ position:absolute; top:0; left:0; right:0; height:90px; z-index:1;
  background:linear-gradient(180deg, rgba(10,5,8,0.5), rgba(10,5,8,0)); }
/* 底部渐隐融入页面背景 */
.hero-scrim{ position:absolute; left:0; right:0; bottom:0; height:62%; z-index:1;
  background:linear-gradient(180deg, rgba(18,12,16,0) 0%, rgba(18,12,16,0.65) 55%, #150c12 100%); }
.hero:focus{ outline:none; }
.hero:focus::after{ content:''; position:absolute; top:0;left:0;right:0;bottom:0; z-index:2;
  box-shadow:inset 0 0 0 3px var(--rose-2); }

.d-title{ font-size:18px; font-weight:800; line-height:1.4; margin:2px 0 8px; text-shadow:0 2px 12px rgba(0,0,0,0.6); }
.d-meta{ font-size:12px; color:var(--muted); margin-bottom:14px; }
.d-meta b{ color:var(--rose-2); font-weight:700; }
.d-play{ display:table; margin:2px auto 16px; padding:13px 56px; border-radius:999px; text-align:center; font-size:15px; font-weight:800;
  color:#fff; background:linear-gradient(120deg,var(--rose),var(--rose-2)); box-shadow:0 8px 22px rgba(244,40,94,0.35); }
.d-play:focus{ outline:none; box-shadow:0 0 0 3px rgba(244,40,94,0.55), 0 8px 22px rgba(244,40,94,0.4); }
.d-sec{ font-size:13px; font-weight:800; color:var(--text); margin:16px 2px 8px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
.no-layout-gap .chips{ display:block; }
.chip{ display:inline-block; padding:6px 12px; border-radius:999px; font-size:12px; color:var(--text);
  background:var(--panel-2); border:1px solid var(--line); }
.no-layout-gap .chip{ margin:0 8px 8px 0; }
.chip.who{ color:var(--rose-2); }
.chip:focus{ border-color:var(--rose-2); color:#fff; outline:none; }

/* ============ 设置浮层 ============ */
.set{ position:fixed; top:0;left:0;right:0;bottom:0; z-index:95; display:none; overflow-y:auto;
  background:var(--panel-strong); }
@supports (backdrop-filter: blur(2px)){ .set{ -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); } }
.set.on{ display:block; }
.set-in{ max-width:640px; margin:0 auto; padding:14px;
  padding-top:calc(var(--safe-top) + 14px); padding-bottom:calc(var(--safe-bottom) + 28px); }
.set-hd{ display:flex; align-items:center; margin-bottom:14px; }
.set-hd .bk{ width:38px;height:38px; display:inline-flex; align-items:center; justify-content:center; color:#fff; line-height:0; border-radius:10px; }
.set-hd .bk:focus{ background:rgba(255,255,255,0.08); color:var(--rose-2); }
.set-hd .tt{ font-size:17px; font-weight:800; margin-left:6px; }
.row{ display:flex; align-items:center; padding:14px 12px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); margin-bottom:10px; }
.row .lab{ flex:1; }
.row .lab .n{ font-size:14px; font-weight:700; }
.row .lab .d{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; }
.no-layout-gap .row .lab{ display:inline-block; width:70%; }
.tgl{ width:48px; height:28px; border-radius:999px; background:#3a2530; position:relative; flex:none; transition:background .2s ease; }
.tgl .dot{ position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:999px; background:#fff; transition:left .2s ease; }
.tgl.on{ background:var(--rose); }
.tgl.on .dot{ left:23px; }
.tgl:focus{ outline:none; box-shadow:0 0 0 2px rgba(244,40,94,0.6); }
.seg{ display:flex; gap:6px; flex:none; }
.no-layout-gap .seg{ display:inline-block; }
.seg button{ padding:6px 12px; border-radius:9px; font-size:13px; color:var(--muted); background:#2a1b24; border:1px solid var(--line); }
.no-layout-gap .seg button{ margin-left:6px; }
.seg button.on{ color:#fff; background:var(--rose); border-color:transparent; }
.seg button:focus{ border-color:var(--rose-2); color:#fff; outline:none; }
.note{ font-size:12px; color:var(--muted); line-height:1.6; padding:6px 12px; }
.note code{ background:rgba(255,255,255,0.08); padding:1px 5px; border-radius:5px; }

/* ============ toast ============ */
.toast{ position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 28px); transform:translateX(-50%) translateY(20px);
  z-index:120; max-width:80%; padding:11px 18px; border-radius:12px; font-size:14px; color:#fff;
  background:rgba(20,10,16,0.95); border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,0.5);
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){ .toast{ transition:opacity .2s ease; } }
</style>

<script>
(function () {
  'use strict';

  /* ---------- 常量 ---------- */
  var SITE = 'https://jable.tv';
  var DEF_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36';

  function $(id){ return document.getElementById(id); }
  function isNative(){ return !!(window.fm && window.fm.req); }
  function whenFm(){
    if (window.fm) return Promise.resolve(window.fm);
    return new Promise(function (resolve) {
      var done = false;
      function ok(){ if (done) return; done = true; resolve(window.fm || null); }
      window.addEventListener('fmsdk', ok, { once: true });
      setTimeout(ok, 2500);
    });
  }

  var elList = $('list'), elMore = $('more'), elState = $('state'), elTabs = $('tabs'), elToast = $('toast');
  var elSheet = $('sheet'), elDetailBody = $('detailBody'), elDHead = $('dHeadTitle');
  var elSet = $('setSheet'), elSug = $('sug'), elQ = $('q');
  var elSub = $('subbar'), elSubTitle = $('subTitle');

  /* ---------- 偏好 ---------- */
  var prefs = { hd: true, referer: false, sniff: true };
  var store = {
    get: async function (k) {
      try { if (isNative() && fm.cache) { return (await fm.cache.get(k, 'jable')) || ''; } } catch (e) {}
      try { return localStorage.getItem('jable_' + k) || ''; } catch (e) { return ''; }
    },
    set: async function (k, v) {
      try { if (isNative() && fm.cache) { await fm.cache.set(k, String(v), 'jable'); return; } } catch (e) {}
      try { localStorage.setItem('jable_' + k, String(v)); } catch (e) {}
    }
  };
  async function loadPrefs(){
    var hd = await store.get('hd'); if (hd !== '') prefs.hd = hd === '1';
    var rf = await store.get('referer'); if (rf !== '') prefs.referer = rf === '1';
    var sn = await store.get('sniff'); if (sn !== '') prefs.sniff = sn === '1';
  }

  /* ---------- toast / 网络灯 ---------- */
  function toast(m){ elToast.textContent = m; elToast.className = 'toast show'; clearTimeout(toast._t); toast._t = setTimeout(function(){ elToast.className = 'toast'; }, 2600); }
  function netDot(ok){ var d = $('netDot'); if (d) d.className = 'mark' + (ok ? '' : ' bad'); }

  /* ---------- 网络 ---------- */
  async function req(url, opt){
    opt = opt || {};
    var headers = opt.headers || {};
    if (!headers['User-Agent']) headers['User-Agent'] = DEF_UA;
    if (!headers.Referer) headers.Referer = SITE + '/';
    // 浏览器都会带的标准头：不少 WAF 的 403 只是因为请求“不像浏览器”
    if (!headers['Accept']) headers['Accept'] = 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8';
    if (!headers['Accept-Language']) headers['Accept-Language'] = 'zh-CN,zh;q=0.9,en;q=0.8,ja;q=0.7';
    if (!headers['Upgrade-Insecure-Requests']) headers['Upgrade-Insecure-Requests'] = '1';
    if (isNative()) {
      var r = await fm.req(url, {
        method: opt.method || 'GET',
        headers: headers,
        responseType: opt.responseType || 'text',
        timeout: opt.timeout || 20,
        credentials: 'include'
      });
      netDot(!!(r && r.ok));
      if (!r || !r.ok) throw new Error((r && r.error) || ('HTTP ' + (r && r.status)));
      return r.body;
    }
    // 浏览器预览兜底（会受 CORS 限制）
    var resp = await fetch(url, { headers: headers });
    netDot(resp.ok);
    if (opt.responseType === 'json') return resp.json();
    return resp.text();
  }

  function resUrl(u){
    if (!u) return '';
    if (u.indexOf('//') === 0) u = 'https:' + u;
    if (isNative() && fm.res) {
      try { return fm.res(u, { headers: { 'User-Agent': DEF_UA, Referer: SITE + '/' } }); } catch (e) { return u; }
    }
    return u;
  }

  /* 不抛异常，返回 { ok, status, bytes, body, err, cf }，用于诊断 */
  function looksCF(body){
    if (!body) return false;
    var s = body.slice(0, 4000);
    return s.indexOf('Just a moment') !== -1 || s.indexOf('cf-browser-verification') !== -1 ||
           s.indexOf('challenge-platform') !== -1 || s.indexOf('__cf_chl') !== -1 ||
           s.indexOf('Attention Required') !== -1 || s.indexOf('cf-chl') !== -1;
  }
  async function netGet(url){
    try {
      var body = await req(url);
      body = body || '';
      return { ok: true, status: 200, bytes: body.length, body: body, err: '', cf: looksCF(body) };
    } catch (e) {
      var msg = (e && e.message) ? e.message : String(e);
      var st = msg.match(/HTTP\s+(\d+)/); st = st ? +st[1] : 0;
      return { ok: false, status: st, bytes: 0, body: '', err: msg, cf: false };
    }
  }
  function dlog(){ try { if (window.console && console.log) console.log.apply(console, ['[jable]'].concat(Array.prototype.slice.call(arguments))); } catch (e) {} }

  /* ---------- 懒加载图片 ---------- */
  var lazyList = [];
  function lazyLoad(img){
    if (img._done) return; img._done = true;
    var u = img.getAttribute('data-src'); if (!u) return;
    img.onload = function(){ img.className = 'in'; };
    img.onerror = function(){ img.onerror = null; img.style.opacity = '0'; };
    img.src = resUrl(u);
  }
  function lazyScan(){
    if (!lazyList.length) return;
    var h = window.innerHeight + 500, i, img, r;
    for (i = lazyList.length - 1; i >= 0; i--) {
      img = lazyList[i]; r = img.getBoundingClientRect();
      if (r.top < h && r.bottom > -500) { lazyLoad(img); lazyList.splice(i, 1); }
    }
  }

  /* ---------- 解析：列表卡片 ---------- */
  function parseDoc(html){
    try { return new DOMParser().parseFromString(html, 'text/html'); }
    catch (e) { var d = document.implementation.createHTMLDocument(''); d.documentElement.innerHTML = html; return d; }
  }
  function txt(el){ return el ? (el.textContent || '').replace(/\s+/g, ' ').replace(/^ | $/g, '') : ''; }
  function firstNum(s){
    s = String(s).replace(/[\u00a0\u2009\u202f]/g, ' ');
    var m = s.match(/\d{1,3}(?: \d{3})+|\d+/);
    return m ? m[0].replace(/ /g, '') : '';
  }
  /* .sub-title 结构是 [眼睛svg]播放量[心svg]喜欢数，文本会被拼成 "20 295 164"，
     空格既是千分位又是分隔，无法从整串区分。改取第一个含数字文本节点=播放量。 */
  function firstTextChunk(el){
    if (!el) return '';
    var nodes = el.childNodes, i, t;
    for (i = 0; i < nodes.length; i++) {
      if (nodes[i].nodeType === 3) {
        t = (nodes[i].nodeValue || '').replace(/\s+/g, ' ').replace(/^ | $/g, '');
        if (t && /\d/.test(t)) return t;
      }
    }
    return txt(el);
  }

  function parseCards(html){
    var doc = parseDoc(html);
    var boxes = doc.querySelectorAll('.video-img-box');
    var out = [], seen = {};
    boxes.forEach(function (box) {
      var a = box.querySelector('.img-box a[href], a[href*="/videos/"]');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (href.indexOf('/videos/') === -1) return;
      if (href.indexOf('http') !== 0) href = SITE + (href.charAt(0) === '/' ? '' : '/') + href;
      if (seen[href]) return; seen[href] = 1;
      var img = box.querySelector('img');
      var pic = img ? (img.getAttribute('data-src') || img.getAttribute('src') || '') : '';
      var big = box.querySelector('img[data-preview]');
      var preview = big ? big.getAttribute('data-preview') : '';
      var label = box.querySelector('.label');
      var titleEl = box.querySelector('.detail .title, .title');
      var title = txt(titleEl) || txt(a.getAttribute('title')) || (img && img.getAttribute('alt')) || '';
      var subEl = box.querySelector('.sub-title');
      out.push({
        url: href,
        pic: pic,
        preview: preview || '',
        title: title || codeOf(href),
        dur: txt(label),
        hits: firstNum(firstTextChunk(subEl))
      });
    });
    return out;
  }
  function codeOf(url){ var m = String(url).match(/\/videos\/([^/]+)\//); return m ? m[1].toUpperCase() : ''; }

  /* ---------- 解析：详情页 ---------- */
  function parseDetail(html){
    var doc = parseDoc(html);
    // 本片信息容器：女优/标签/标题都在这里，避免抓到全站导航和标签云
    var info = doc.querySelector('.video-info') || doc.querySelector('.info-header') || doc;
    var head = info.querySelector('.header-left') || info;
    var title = txt(head.querySelector('h4')) || txt(doc.querySelector('h4')) || '';
    var og = doc.querySelector('meta[property="og:image"]');
    var poster = og ? og.getAttribute('content') : '';
    if (!poster) { var v = doc.querySelector('video[poster]'); if (v) poster = v.getAttribute('poster'); }
    var models = [];
    info.querySelectorAll('a[href*="/models/"]').forEach(function (a) {
      var href = a.getAttribute('href') || '';
      if (href.indexOf('/models/') === -1) return;
      if (/\/models\/?($|#|\?)/.test(href)) return; // 排除“按女優”索引页
      var sp = a.querySelector('[data-original-title], [title]');
      var name = (sp && (sp.getAttribute('data-original-title') || sp.getAttribute('title'))) || txt(a);
      if (!name) return;
      if (href.indexOf('http') !== 0) href = SITE + href;
      if (!models.some(function (x) { return x.url === href; })) models.push({ name: name, url: href });
    });
    var tags = [];
    info.querySelectorAll('a[href*="/tags/"]').forEach(function (a) {
      var href = a.getAttribute('href') || '';
      var name = txt(a);
      if (!name || href.indexOf('/tags/') === -1) return;
      if (/\/tags\/?($|#|\?)/.test(href)) return; // 排除“按主題”索引页

      if (!tags.some(function (x) { return x.url === href; })) tags.push({ name: name, url: href });
    });

    var meta = '';
    var spans = head.querySelectorAll('h6 span');
    if (spans && spans.length) { meta = Array.prototype.map.call(spans, function (s) { return txt(s); }).filter(Boolean).slice(0, 2).join(' · '); }
    var related = parseCards(html).filter(function (c) { return c.title || c.pic; }).slice(0, 12);

  /* ---------- 提取 m3u8 ---------- */
  function extractHls(rawHtml){
    if (!rawHtml) return '';
    var m = rawHtml.match(/var\s+hlsUrl\s*=\s*['"]([^'"]+)['"]/);
    if (m && m[1]) return m[1];
    m = rawHtml.match(/hlsUrl\s*[:=]\s*['"]([^'"]+\.m3u8[^'"]*)['"]/);
    if (m && m[1]) return m[1];
    m = rawHtml.match(/(https?:\/\/[^'"\s<>]+?\.m3u8[^'"\s<>]*)/);
    if (m && m[1]) return m[1];
    return '';
  }
  function absUrl(base, rel){
    try { return new URL(rel, base).href; } catch (e) {}
    if (/^https?:\/\//i.test(rel)) return rel;
    if (rel.indexOf('//') === 0) return 'https:' + rel;
    var b = String(base).replace(/[?#].*$/, '');
    if (rel.charAt(0) === '/') { var mm = b.match(/^(https?:\/\/[^/]+)/); return (mm ? mm[1] : '') + rel; }
    return b.replace(/\/[^/]*$/, '/') + rel;
  }
  /* 抓 master 播放列表，挑分辨率最高的变体；返回 { url, h }（h=高度，如 720/1080） */
  async function resolveHls(masterUrl){
    var txt = '';
    try { txt = await req(masterUrl, { timeout: 12 }); } catch (e) { return { url: masterUrl, h: 0 }; }
    if (!txt || txt.indexOf('#EXT-X-STREAM-INF') === -1) return { url: masterUrl, h: 0 }; // 已是媒体列表
    var lines = txt.split(/\r?\n/), best = null, bestScore = -1, i, j;
    for (i = 0; i < lines.length; i++) {
      if (!/#EXT-X-STREAM-INF/i.test(lines[i])) continue;
      var res = lines[i].match(/RESOLUTION=\d+x(\d+)/i);
      var bw = lines[i].match(/BANDWIDTH=(\d+)/i);
      var h = res ? parseInt(res[1], 10) : 0;
      var score = res ? h : (bw ? parseInt(bw[1], 10) / 1000 : 0);
      j = i + 1; while (j < lines.length && (!lines[j].replace(/\s/g, '') || lines[j].charAt(0) === '#')) j++;
      var vurl = j < lines.length ? lines[j].replace(/^\s+|\s+$/g, '') : '';
      if (vurl && score > bestScore) { bestScore = score; best = { url: absUrl(masterUrl, vurl), h: h }; }
    }
    return best ? best : { url: masterUrl, h: 0 };
  }

      dlog('fetch', urls[i], '-> ok=' + r.ok, 'status=' + r.status, 'bytes=' + r.bytes, 'cards=' + got.length, r.cf ? 'CLOUDFLARE' : '');

  async function play(item, d){

    var big = (d && d.poster) || item.pic || '';

        window.__fmWebHomeInlineResolver = function (ep) {
          var r = { url: playUrl, format: 'application/x-mpegURL' };
          if (hdr) r.headers = hdr;
          return r;
        };
        await fm.vodInline({
          vod_id: 'jable_' + code,
          vod_name: title,
          vod_pic: pic,
          wallPic: wall,
          vod_play_from: line,
          mark: line,
          headers: hdr || undefined,
          episodes: [{ name: line, url: playUrl, resolve: true, pageUrl: item.url }]
        });
        return;
      } catch (e) { /* 落到 fm.play */ }
    }
    // 次选 fm.play（旧版无 vodInline）
    if (m3u8 && fm.play) {
      try {
        var opt = { pic: pic, wallPic: wall, format: 'hls' };
        if (hdr) opt.headers = hdr;
        await fm.play(m3u8, title, opt);
        return;
      } catch (e) { /* 落到嗅探 */ }
    }
    // 兜底：交给 App 推送 / WebView 嗅探
    if (prefs.sniff && fm.pan && fm.pan.play) {

  }
  function resolvePic(u){ return u ? resUrl(u) : ''; }

  /* ---------- 搜索 ---------- */
  var HISTORY_KEY = 'search_history';
  var hist = [];
  async function loadHist(){ try { hist = JSON.parse((await store.get(HISTORY_KEY)) || '[]'); } catch (e) { hist = []; } if (!hist.map) hist = []; }
  async function saveHist(){ await store.set(HISTORY_KEY, JSON.stringify(hist.slice(0, 12))); }
  function addHist(kw){ kw = kw.replace(/^ | $/g, ''); if (!kw) return; hist = hist.filter(function (x) { return x !== kw; }); hist.unshift(kw); saveHist(); }

  function openSug(){
    var items = hist.slice(0, 10);
    elSug.replaceChildren();
    if (!items.length) { elSug.className = 'sug'; return; }
    items.forEach(function (kw) {
      var row = document.createElement('div'); row.className = 'sug-row';
      var hit = document.createElement('button'); hit.className = 'sug-hit'; hit.setAttribute('tabindex', '0');
      hit.innerHTML = '<span class="k">🕘</span>' + esc(kw);
      hit.addEventListener('click', function () { elQ.value = kw; doSearch(); });
      var del = document.createElement('button'); del.className = 'sug-del'; del.textContent = '×'; del.setAttribute('tabindex', '0'); del.setAttribute('aria-label', '删除');
      del.addEventListener('click', function (ev) { ev.stopPropagation(); hist = hist.filter(function (x) { return x !== kw; }); saveHist(); openSug(); });
      row.appendChild(hit); row.appendChild(del); elSug.appendChild(row);
    });
    elSug.className = 'sug open';
  }
  function closeSug(){ elSug.className = 'sug'; document.body.classList.remove('searching'); }
  function clearSearch(){ elQ.value = ''; closeSug(); }

  function doSearch(){
    var kw = (elQ.value || '').replace(/^ | $/g, '');
    if (!kw) { toast('输入点什么吧'); return; }
    addHist(kw); closeSug();
    try { elQ.blur(); } catch (e) {}
    view.mode = 'search'; view.kw = kw; view.title = '搜索：' + kw;
    elTabs.className = 'tabs off'; elSub.className = 'subbar on'; elSubTitle.textContent = '搜索：' + kw;
    closeDetail(true);
    pushRoute('listing');
    window.scrollTo(0, 0);
    load(true);
  }
  elQ.addEventListener('focus', function () { document.body.classList.add('searching'); openSug(); });
  elQ.addEventListener('input', function () { openSug(); });
  elQ.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.keyCode === 13) doSearch(); });
  $('go').addEventListener('click', doSearch);
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (!e.target.closest('.search')) closeSug();
  });

  /* ---------- 路由 / 返回 ---------- */
  function pushRoute(kind){ try { history.pushState({ r: kind, t: Date.now() }, '', '#' + kind); } catch (e) {} }
  window.addEventListener('popstate', function () {
    if (elSet.className.indexOf('on') !== -1) { closeSet(); return; }
    if (elSheet.className.indexOf('on') !== -1) { closeDetail(true); return; }
    if (view.mode === 'listing' || view.mode === 'search') {
      // 回到普通 tab
      clearSearch();
      var t = tabById(view.tab) || TABS[0];
      view.mode = 'tab'; view.tab = t.id; view.path = t.path; view.block = t.block; view.sort = t.sort; view.kw = '';
      elSub.className = 'subbar'; elTabs.className = 'tabs';
      renderTabs(); load(true); window.scrollTo(0, 0);
      return;
    }
  });
  function tabById(id){ for (var i = 0; i < TABS.length; i++) if (TABS[i].id === id) return TABS[i]; return null; }

  /* ---------- 设置 ---------- */
  function openSet(){ elSet.className = 'set on'; elSet.setAttribute('aria-hidden', 'false'); syncToggles(); pushRoute('set'); }
  function closeSet(){ elSet.className = 'set'; elSet.setAttribute('aria-hidden', 'true'); }
  function syncToggles(){
    $('tglHd').className = 'tgl' + (prefs.hd ? ' on' : '');
    $('tglRef').className = 'tgl' + (prefs.referer ? ' on' : '');
    $('tglSniff').className = 'tgl' + (prefs.sniff ? ' on' : '');
  }
  $('gear').addEventListener('click', openSet);
  $('setBack').addEventListener('click', function () { history.back(); });
  $('tglHd').addEventListener('click', function () { prefs.hd = !prefs.hd; store.set('hd', prefs.hd ? '1' : '0'); syncToggles(); });
  $('tglRef').addEventListener('click', function () { prefs.referer = !prefs.referer; store.set('referer', prefs.referer ? '1' : '0'); syncToggles(); });
  $('tglSniff').addEventListener('click', function () { prefs.sniff = !prefs.sniff; store.set('sniff', prefs.sniff ? '1' : '0'); syncToggles(); });

  $('brand').addEventListener('click', function () { selectTab(TABS[0]); window.scrollTo(0, 0); });

  /* ---------- TV 焦点辅助 ---------- */
  function focusSoon(el){ if (!el) return; requestAnimationFrame(function () { try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} } }); }
  function isTV(){ return !!(window.fongmiClient && window.fongmiClient.isLeanback) || document.documentElement.className.indexOf('fm-tv') !== -1; }
  function visibleFocusables(){
    var scope = document;
    if (elSet.className.indexOf('on') !== -1) scope = elSet;
    else if (elSheet.className.indexOf('on') !== -1) scope = elSheet;
    var nodes = scope.querySelectorAll('[tabindex="0"], input, button');
    var out = [];
    Array.prototype.forEach.call(nodes, function (n) {
      var r = n.getBoundingClientRect();
      if (r.width > 0 && r.height > 0 && n.offsetParent !== null) out.push(n);
    });
    return out;
  }
  function nearest(cur, key){
    var list = visibleFocusables(); if (!list.length) return null;
    var cr = cur.getBoundingClientRect(), best = null, bestScore = 1e12;
    var cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    list.forEach(function (n) {
      if (n === cur) return;
      var r = n.getBoundingClientRect(), nx = r.left + r.width / 2, ny = r.top + r.height / 2;
      var dx = nx - cx, dy = ny - cy, ok = false;
      if (key === 'ArrowRight') ok = dx > 6 && Math.abs(dy) < Math.max(cr.height, r.height);
      else if (key === 'ArrowLeft') ok = dx < -6 && Math.abs(dy) < Math.max(cr.height, r.height);
      else if (key === 'ArrowDown') ok = dy > 6;
      else if (key === 'ArrowUp') ok = dy < -6;
      if (!ok) return;
      var score = Math.abs(dx) + Math.abs(dy) * ((key === 'ArrowUp' || key === 'ArrowDown') ? 1 : 2.2);
      if (score < bestScore) { bestScore = score; best = n; }
    });
    return best;
  }
  document.addEventListener('keydown', function (e) {
    var key = e.key;
    if (key === 'Backspace' || key === 'GoBack' || key === 'BrowserBack') {
      if (elSet.className.indexOf('on') !== -1 || elSheet.className.indexOf('on') !== -1 ||
          view.mode === 'listing' || view.mode === 'search' || elSug.className.indexOf('open') !== -1) {
        e.preventDefault(); if (elSug.className.indexOf('open') !== -1) { closeSug(); return; } history.back(); return;
      }
    }
    if (!isTV()) return;
    if (key !== 'ArrowUp' && key !== 'ArrowDown' && key !== 'ArrowLeft' && key !== 'ArrowRight') {
      if ((key === 'Enter' || key === 'OK') && document.activeElement && document.activeElement.click) {
        // 让原生 click 生效
      }
      return;
    }
    var cur = document.activeElement;
    if (!cur || cur === document.body) { var f = visibleFocusables()[0]; if (f) { e.preventDefault(); focusSoon(f); } return; }
    if (cur.tagName === 'INPUT' && cur.type === 'search') return;
    var t = nearest(cur, key);
    if (t) { e.preventDefault(); try { t.focus({ preventScroll: true }); } catch (e2) { t.focus(); }
      var r = t.getBoundingClientRect(); if (r.top < 70 || r.bottom > window.innerHeight - 20) t.scrollIntoView({ block: 'center' }); }
  });

  /* card 焦点高亮（用 class，不用 :focus-visible） */
  document.addEventListener('focusin', function (e) {
    var prev = document.querySelector('.card-inner.focus'); if (prev) prev.className = 'card-inner';
    var c = e.target.closest ? e.target.closest('.card') : null;
    if (c) { var inner = c.querySelector('.card-inner'); if (inner) inner.className = 'card-inner focus'; }
  });

  /* ---------- viewport 事件 ---------- */
  window.addEventListener('fmviewport', function () {});

  /* ---------- 启动 ---------- */
  async function boot(){
    await whenFm();
    await loadPrefs();
    await loadHist();
    renderTabs();
    autoPage();
    load(true);
    // 首帧焦点：TV 端落到第一个 tab
    if (isTV()) { var t = elTabs.querySelector('.tab.on') || elTabs.querySelector('.tab'); focusSoon(t); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
